<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · ML Academy</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages bu dosyayı bulunamayan her adres için gösteriyor. Önceden
     yoktu ve ziyaretçi GitHub'ın kendi çıplak 404'üne düşüyordu, yani
     sitenin dışına çıkmış gibi oluyordu. -->
<style>
  :root{--bg:#f6f8fc;--panel:#fff;--line:#dde5ef;--txt:#0f1b2d;--mut:#586a80;
        --green:#0a8b68;--mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
  @media(prefers-color-scheme:dark){:root{--bg:#080b11;--panel:#0f151e;--line:#1e2a3a;
        --txt:#e6edf3;--mut:#8494a8;--green:#22d3a0}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--txt);line-height:1.65;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}
  .kap{max-width:520px;text-align:center}
  .kod{font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--mut);
       text-transform:uppercase}
  h1{font-size:clamp(24px,4vw,32px);letter-spacing:-.02em;margin:14px 0 10px}
  p{color:var(--mut);margin:0 0 26px}
  .dug{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
  a.ana{background:var(--green);color:#fff;text-decoration:none;font-weight:700;
        padding:13px 22px;border-radius:12px}
  a.yan{background:var(--panel);border:1px solid var(--line);color:var(--txt);
        text-decoration:none;padding:13px 22px;border-radius:12px}
  .tr{margin-top:22px;font-size:13.5px;color:var(--mut)}
</style>
</head>
<body>
  <div class="kap">
    <div class="kod">404</div>
    <h1>This page does not exist</h1>
    <p>The address may be mistyped, or the page may have moved.</p>
    <div class="dug">
      <a class="ana" href="/">All lessons</a>
      <a class="yan" href="/modeller.html">Model catalogue</a>
    </div>
    <p class="tr">Bu sayfa yok. <a href="/?lang=tr">Bütün dersler</a></p>
  </div>
</body>
</html>
