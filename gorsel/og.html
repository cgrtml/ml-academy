<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#070a0f;overflow:hidden;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;

        -webkit-background-clip:text;background-clip:text;color:transparent}

  .sayilar{margin-top:44px;display:flex;gap:56px}

        letter-spacing:.17em;text-transform:uppercase;color:#5d7089}

  .cizgi i{flex:1}

<body>

  </div>
  <div class="cizgi">
    <i style="background:#22d3a0"></i><i style="background:#4cc4ff"></i>
    <i style="background:#fb923c"></i><i style="background:#a78bfa"></i>
    <i style="background:#f472b6"></i>
  </div>
