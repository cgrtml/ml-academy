<!doctype html>
<html><head><meta charset="utf-8">
<!-- ML Academy · paylaşım kartları
     ─────────────────────────────────────────────────────────────────────
     Tek şablon, adres çubuğundaki ?k= parametresiyle hangi kartın
     çizileceğine karar verir. og.html ile aynı mantık: kart elle
     çizilmiyor, tarayıcıda çiziliyor ve ekran görüntüsü alınıyor.
     Sayılar değişince gorsel/kart-uret.sh tekrar çalıştırılır.

     Biçimler:
       hikaye  1080x1920  Instagram / WhatsApp durumu
       kare    1080x1080  Instagram gönderisi, LinkedIn kare
       yatay   1200x627   LinkedIn / X gönderisi

     Kartlarda yazan her sayı dogrula.sh'in doğruladığı sayı. Uydurma
     rakam girme; girersen sitenin kendi kuralını gönderide çiğnemiş
     olursun.                                                            -->
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#070a0f;overflow:hidden;position:relative;color:#fff;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;justify-content:center}
  .marka{font-family:'SF Mono',Menlo,Consolas,monospace;font-weight:700;
         letter-spacing:.32em;color:#22d3a0}
  .adres{font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:.05em;color:#4a5b70}
  h1{font-weight:850;letter-spacing:-.035em;line-height:1.07}
  h1 em{font-style:normal;background:linear-gradient(96deg,#22d3a0,#4cc4ff);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .alt{color:#8fa1b6;line-height:1.5}
  .sayilar{display:flex;flex-wrap:wrap}
  .s .n{font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1}
  .s .l{font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:.16em;
        text-transform:uppercase;color:#5d7089}
  .kural{border-left:3px solid #22d3a0;background:rgba(34,211,160,.07);
         color:#c9d6e4;line-height:1.55}
  .kural b{color:#fff;font-weight:700}
  .cizgi{position:absolute;left:0;right:0;bottom:0;display:flex}
  .cizgi i{flex:1}

  /* ── 1080x1920 ── */
  body.hikaye{width:1080px;height:1920px;padding:0 84px}
  .hikaye .marka{font-size:24px}
  .hikaye h1{margin-top:46px;font-size:96px}
  .hikaye .alt{margin-top:40px;font-size:36px;max-width:860px}
  .hikaye .sayilar{margin-top:88px;gap:58px 84px}
  .hikaye .s .n{font-size:66px}
  .hikaye .s .l{margin-top:9px;font-size:18px}
  .hikaye .kural{margin-top:96px;padding:34px 38px;font-size:31px;border-radius:0 16px 16px 0}
  .hikaye .adres{margin-top:88px;font-size:34px;color:#8fa1b6}
  .hikaye .cizgi{height:16px}

  /* ── 1080x1080 ── */
  body.kare{width:1080px;height:1080px;padding:0 76px}
  .kare .marka{font-size:20px}
  .kare h1{margin-top:34px;font-size:74px}
  .kare .alt{margin-top:30px;font-size:29px;max-width:820px}
  .kare .sayilar{margin-top:56px;gap:38px 66px}
  .kare .s .n{font-size:50px}
  .kare .s .l{margin-top:7px;font-size:15px}
  .kare .kural{margin-top:60px;padding:26px 30px;font-size:25px;border-radius:0 14px 14px 0}
  .kare .adres{margin-top:52px;font-size:27px;color:#8fa1b6}
  .kare .cizgi{height:13px}

  /* ── 1200x627 ── */
  body.yatay{width:1200px;height:627px;padding:0 72px}
  .yatay .marka{font-size:17px}
  .yatay h1{margin-top:26px;font-size:56px}
  .yatay .alt{margin-top:22px;font-size:23px;max-width:1000px}
  .yatay .sayilar{margin-top:38px;gap:24px 52px}
  .yatay .s .n{font-size:34px}
  .yatay .s .l{margin-top:4px;font-size:12px}
  .yatay .kural{margin-top:34px;padding:18px 22px;font-size:19px;border-radius:0 12px 12px 0}
  .yatay .adres{margin-top:30px;font-size:19px;color:#8fa1b6}
  .yatay .cizgi{height:10px}
  .yatay .kural{display:none}          /* yatayda yer yok, kural başlığa taşındı */
</style></head>
<body>
  <div class="marka">ML ACADEMY</div>
  <h1 id="bas"></h1>
  <p class="alt" id="alt"></p>
  <div class="sayilar" id="say"></div>
  <div class="kural" id="kural"></div>
  <div class="adres">mltraining.org</div>
  <div class="cizgi">
    <i style="background:#22d3a0"></i><i style="background:#4cc4ff"></i>
    <i style="background:#fb923c"></i><i style="background:#a78bfa"></i>
    <i style="background:#f472b6"></i>
  </div>

<script>
/* Rakamlar tek yerde. dogrula.sh çıktısıyla birebir aynı olmalı. */
const N = { ders:'123', adim:'401', sim:'165', sayi:'2.395', sayiEn:'2,395' };

const METIN = {
  tr: {
    bas:  'Makine öğrenmesini<br>izleme. <em>Çalıştır.</em>',
    alt:  'Her algoritma sıfırdan yazıldı ve tarayıcında çalışıyor. Kaydırıcıyı sen oynatıyorsun, model cevap veriyor. Tahminini sen yazıyorsun, kod kontrol ediyor.',
    say:  [[N.ders,'ders'],[N.adim,'adım'],[N.sim,'simülasyon'],[N.sayi,'doğrulanmış sayı']],
    kural:'Derste yazan hiçbir sayı, <b>onu yeniden hesaplayan bir test olmadan</b> yayına girmez.',
    yatayBas:'Derste yazan hiçbir sayı,<br><em>bir test onu yeniden hesaplamadan</em> yayına girmez.',
    yatayAlt:'123 interaktif makine öğrenmesi dersi, tarayıcıda çalışıyor. Video yok, kurulum yok, ücret yok.',
  },
  en: {
    bas:  "Don't watch machine<br>learning. <em>Run it.</em>",
    alt:  'Every algorithm is written from scratch and runs in your browser. You move the slider, the model responds. You make a prediction, the code checks it.',
    say:  [[N.ders,'lessons'],[N.adim,'steps'],[N.sim,'simulations'],[N.sayiEn,'verified numbers']],
    kural:'A number does not appear in a lesson <b>unless a test recomputes it.</b>',
    yatayBas:'A number does not appear in a lesson<br><em>unless a test recomputes it.</em>',
    yatayAlt:'123 interactive machine learning lessons that run in your browser. No videos, no installation, no payment.',
  },
};

const q     = new URLSearchParams(location.search);
const bicim = q.get('b') || 'yatay';
const dil   = q.get('d') || 'en';
const M     = METIN[dil];

document.body.className = bicim;
document.getElementById('bas').innerHTML = bicim === 'yatay' ? M.yatayBas : M.bas;
document.getElementById('alt').textContent = bicim === 'yatay' ? M.yatayAlt : M.alt;
document.getElementById('kural').innerHTML = M.kural;
document.getElementById('say').innerHTML = M.say.map(
  ([n,l]) => '<div class="s"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('');
</script>
</body></html>
